      #hamoki-first-frame{position:fixed;inset:0;z-index:2147483600;display:flex;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 42%,#132c2d 0%,#0a191b 68%);color:#b0cabe;font:500 13px system-ui,'Microsoft YaHei',sans-serif;letter-spacing:.05em;pointer-events:all;transition:opacity .18s ease,visibility .18s ease;}

      @keyframes hamoki-first-spin{to{transform:rotate(360deg)}}
      html:not(.hs-preparing) #hamoki-first-frame{opacity:0;visibility:hidden;pointer-events:none;}
      @media(prefers-reduced-motion:reduce){#hamoki-first-frame::before{animation:none;border-color:#77d9a8;}#hamoki-first-frame{transition:none;}}
    </style>

    <script id="hamoki-first-frame-ready">
      (()=>{
        let settled=false;
        const reveal=()=>{
          if(settled)return;
          settled=true;
          clearTimeout(window.__hamokiFirstFrameFallback);
          requestAnimationFrame(()=>{
            document.documentElement.classList.remove('hs-preparing');
            setTimeout(()=>document.getElementById('hamoki-first-frame')?.remove(),300);
          });
        };
        const onReady=()=>{
          const panel=document.getElementById('params-panel');
          if(!panel){reveal();return;}
          let observer;
          const check=()=>{
            if(panel.querySelector('#prompt-input,.panel-content')){
              observer?.disconnect();
              requestAnimationFrame(()=>requestAnimationFrame(reveal));
              return true;
            }
            return false;
          };
          if(check())return;
          observer=new MutationObserver(check);
          observer.observe(panel,{childList:true,subtree:true});
          setTimeout(()=>{observer.disconnect();reveal();},2200);
        };
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',onReady,{once:true});
        else onReady();
      })();
    </script>
