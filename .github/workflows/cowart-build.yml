name: Cowart experimental build
on:
  push:
    branches: [feature/cowart-web-canvas-20261016]
  pull_request:
    branches: [feature/cowart-web-canvas-20261016, main]
permissions:
  contents: read
concurrency:
  group: cowart-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared AI handoff
        run: node scripts/check-ai-handoff.mjs
      - name: Validate isolated Cowart QA Compose
        env:
          QA_ENCRYPTION_KEY: ci-compose-validation-only-32-characters
          QA_INVITE_CODE: ci-compose-validation-only
          QA_ALLOWED_HOST: cowart-qa.invalid
        run: docker compose -p hamoki-cowart-qa -f compose.cowart-qa.yaml config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cowart/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python image validation dependencies
        run: python -m pip install pillow pyyaml
      - name: Validate Studio backend
        run: node --check gateway.js
      - name: Install Cowart dependencies
        run: npm ci --no-audit --no-fund
        working-directory: cowart
      - name: Build Cowart preview
        run: npm run build
        working-directory: cowart
      - name: Stage production-like public assets
        run: cp -r cowart/dist cowart-dist
      - name: Install Studio backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Studio regressions and Cowart account isolation
        run: npm test
      - name: Install Chromium for browser smoke
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
        working-directory: cowart
      - name: Test portable archive bytes and additive restore in Chromium
        run: node tests/archive-smoke.mjs
        working-directory: cowart
      - name: Test independent Hamoki canvas interactions and legacy documents
        run: node tests/native-canvas-smoke.mjs
        working-directory: cowart
      - name: Test large canvas asset upload in real Chromium
        run: node tests/asset-upload-smoke.mjs
        working-directory: cowart
      - name: Test Cowart UI, save and reload in real Chromium
        run: node tests/browser-smoke.mjs
        working-directory: cowart
      - name: Test Cowart cancellation and original job queries in real Chromium
        run: node tests/job-controls-smoke.mjs
        working-directory: cowart
      - name: Keep screenshot for UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cowart-browser-smoke
          path: cowart/test-results/*.png
          if-no-files-found: ignore

      - name: Summarize handoff and tested SHA
        if: always()
        run: |
          {
            echo "### Cowart CI handoff"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch/event: \`$GITHUB_REF_NAME\` / \`$GITHUB_EVENT_NAME\`"
            echo "- CI result: see job conclusion above; only a successful entire push run may be promoted to isolated QA"
            echo "- Coordination: docs/AI_COLLABORATION.md, docs/DEV_TASKS.md, PR #22"
            echo "- Production deployment: not performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
