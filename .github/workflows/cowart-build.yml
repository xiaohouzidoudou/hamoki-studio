name: Cowart experimental build
on:
  push:
    branches: [feature/cowart-web-canvas-20261016]
    paths: ['cowart/**', '.github/workflows/cowart-build.yml']
  pull_request:
    paths: ['cowart/**', '.github/workflows/cowart-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cowart/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: cowart
      - run: npm run build
        working-directory: cowart
