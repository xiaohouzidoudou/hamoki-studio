<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hamoki Studio · 全新开始</title><link rel="stylesheet" href="/style.css"></head><body><div class="shell"><header><div class="brand"><span class="mark">H</span><div><strong>Hamoki Studio</strong><small>游戏 UI · 智能设计工作台</small></div></div><span class="version">全新版本 · Alpha 1</span></header><main><section class="controls"><div class="intro"><div class="eyebrow">01 / 设计参数</div><h1>用简单选择，生成专业游戏 UI</h1><p>不用写复杂提示词。确定画风、玩法和节日，系统自动规划布局与美术细节。</p></div><div id="fields"></div><label class="field">活动标题 <span>选填</span><input id="title" maxlength="60" placeholder="例如：万圣节南瓜派对"></label><label class="field">补充要求 <span>选填</span><textarea id="note" maxlength="500" rows="3" placeholder="例如：左边放女巫，右边放排名，背景简单一些"></textarea></label><button id="plan" class="primary">✨ 智能补全设计提示词</button></section><section class="result"><div class="eyebrow">02 / 设计方案</div><h2>实时预览与生成</h2><div class="stage"><div id="imageArea" class="placeholder"><div class="pumpkin">✦</div><strong>从一组选择开始</strong><span>补全提示词后，可以调用生图模型生成完整效果图</span></div></div><div id="status" class="status" role="status">尚未生成设计方案</div><div class="resulthead"><h3>专业提示词</h3><span>可编辑</span></div><textarea id="prompt" rows="13" placeholder="点击左侧按钮，生成专业提示词..."></textarea><div class="actions"><button id="copy" class="secondary">复制提示词</button><button id="generate" class="primary">生成游戏 UI 图片</button></div><p class="hint">图片生成需要服务端配置独立的生图 API；未配置时仍可完整使用提示词规划功能。</p></section></main><footer>Hamoki Studio · 从零重建 · 不使用旧数据和旧功能</footer></div><script src="/app.js"></script></body></html>
