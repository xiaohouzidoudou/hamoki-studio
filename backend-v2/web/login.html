<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamoki Studio · 登录</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px system-ui,"Microsoft YaHei";color:#e9f5f0;background:radial-gradient(circle at 16% 14%,#214c3e,#0a1114 52%)}.panel{width:min(425px,93vw);padding:32px;border:1px solid #ffffff24;background:#ffffff12;backdrop-filter:blur(24px);border-radius:23px;box-shadow:0 25px 80px #0006}h1{font-size:25px;margin:0 0 10px}p{color:#a6bdb4;font-size:13px}.tabs{display:flex;gap:7px;margin:22px 0}.tabs button{flex:1}.tabs button.active{background:#376e57;color:white;border-color:#629782}button,input{font:inherit;border-radius:11px}input{display:block;margin:12px 0;padding:12px;width:100%;color:white;background:#0714128a;border:1px solid #647e7559;outline:none}input:focus{border-color:#78d1aa}button{padding:11px;border:1px solid #ffffff29;background:#ffffff0f;color:#dfebe6;cursor:pointer}button[type=submit]{background:#43b67e;border:0;color:#092217;font-weight:700;width:100%;margin-top:12px}button:disabled{opacity:.6}#message{color:#ffb6ac;min-height:18px}small{color:#a0b5ad}a{color:#7fe0ab}.hidden{display:none}</style></head><body><div class="panel"><h1>Hamoki Studio</h1><p>你的创作空间 · 独立账号 · 独立素材</p><div class="tabs" id="tabs"><button data-mode="login" class="active">登录</button><button data-mode="register">注册</button><button data-mode="sub2">Sub2 登录</button></div><form id="form"><input id="username" autocomplete="username" placeholder="用户名" required><input id="password" type="password" autocomplete="current-password" placeholder="密码（至少10位）" required><input id="code" class="hidden" placeholder="首次激活码" autocomplete="off"><button type="submit" id="submit">登录</button></form><p id="message"></p><small id="hint">无邀请码 · 不提供公共 API 额度</small></div><script>
const form=document.querySelector('#form'),buttons=[...document.querySelectorAll('[data-mode]')],message=document.querySelector('#message'),username=document.querySelector('#username'),password=document.querySelector('#password'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),hint=document.querySelector('#hint');let mode='login';
function pick(next){mode=next;buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===next));username.placeholder=next==='sub2'?'Sub2 账号邮箱':'用户名';username.type=next==='sub2'?'email':'text';code.classList.toggle('hidden',next!=='activate');submit.textContent={login:'登录',register:'创建账号',sub2:'使用 Sub2 登录',activate:'激活管理员 hamoki'}[next];hint.textContent=next==='sub2'?'不会在 Studio 保存你的 Sub2 密码':next==='activate'?'激活码仅从本地服务器控制台获取':'每个账号有独立 1 GiB 图片空间';message.textContent=''}
buttons.forEach(b=>b.addEventListener('click',()=>pick(b.dataset.mode)));
async function post(url,payload){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Request':'1'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw Error(data.error||'操作失败');return data}
form.onsubmit=async e=>{e.preventDefault();message.textContent='';submit.disabled=true;try{const data=await post(({login:'/api/auth/login',register:'/api/auth/register',sub2:'/api/auth/sub2-login',activate:'/api/auth/activate'})[mode],mode==='sub2'?{email:username.value,password:password.value}:mode==='activate'?{code:code.value,password:password.value}:{username:username.value,password:password.value});location.href='/'}catch(e){message.textContent=e.message}finally{submit.disabled=false}};
fetch('/api/auth/status').then(r=>r.json()).then(d=>{if(d.user){location.href='/';return}if(d.needsActivation){buttons.forEach(b=>b.classList.add('hidden'));pick('activate');username.classList.add('hidden');username.required=false}else if(!d.sub2Enabled)buttons.find(b=>b.dataset.mode==='sub2').classList.add('hidden')}).catch(()=>{});
</script></body></html>
