<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamoki Studio · Sub2 登录</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:#e7f2ed;background:radial-gradient(ellipse at 24% 12%,#20483d 0,transparent 46%),radial-gradient(ellipse at 85% 85%,#102824 0,transparent 45%),#091011}
.panel{width:min(440px,100%);padding:36px 32px;background:rgba(221,255,236,.065);border:1px solid #c0f0d72b;border-radius:23px;box-shadow:0 28px 75px #0008;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}
.eyebrow{font-size:12px;letter-spacing:.16em;color:#71cda5;text-transform:uppercase;margin-bottom:12px}
h1{font-size:25px;letter-spacing:-.025em;margin:0 0 10px;font-weight:650}
p{color:#adc1b8;font-size:13px;line-height:1.7;margin:0 0 26px}
label{display:block;color:#c5d6ce;font-size:13px;font-weight:500;margin:18px 0 8px}
input{display:block;width:100%;padding:14px 15px;font:inherit;font-size:15px;color:#f5fff9;background:#061713a6;border:1px solid #86b69b42;border-radius:12px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#75d8aa;box-shadow:0 0 0 3px #6bd2a421}
input::placeholder{color:#6c8a7c}
button{margin-top:26px;display:block;width:100%;padding:13px;border:0;border-radius:12px;color:#062215;font-size:15px;font-weight:650;background:#64ce94;cursor:pointer;transition:background .2s,transform .18s}
button:hover{background:#80dfaa}button:active{transform:scale(.985)}button:disabled{opacity:.55;cursor:wait}
#message{min-height:21px;margin:12px 0 0;color:#ffb9ac;font-size:13px}
#captcha{margin-top:18px;min-height:65px}
[hidden]{display:none!important}
.foot{display:flex;gap:8px;align-items:center;padding-top:19px;margin-top:5px;border-top:1px solid #a3c5b223;color:#8da79b;font-size:12px;line-height:1.6}
.foot b{color:#85dcb0;font-weight:500}
@media(max-width:390px){.panel{padding:27px 22px}h1{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="panel">
  <div class="eyebrow">Hamoki Studio</div>
  <h1>使用 Sub2 账号登录</h1>
  <p>直接使用已有的 Sub2 账号。登录后自动关联你的余额、可用模型和独立创作空间。</p>
  <form id="form">
    <label for="email">Sub2 邮箱</label>
    <input id="email" type="email" autocomplete="username" placeholder="请输入 Sub2 登录邮箱" maxlength="254" required autofocus>
    <label for="password">Sub2 密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="请输入 Sub2 密码" maxlength="128" required>
    <div id="captcha" hidden></div>
    <button id="submit" type="submit">登录并进入画布</button>
  </form>
  <div id="message" role="alert" aria-live="polite"></div>
  <div class="foot"><span>●</span><span><b>独立账号</b> · 个人图片与 API Key 分开保存，Sub2 密码不在 Studio 存储</span></div>
</main>
<script>
const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),submit=document.getElementById('submit'),message=document.getElementById('message'),captcha=document.getElementById('captcha');
let captchaRequired=false,captchaToken='',widgetId=null,wasLoggedIn=false;
async function initializeLogin(){
  try{
    const status=await fetch('/api/auth/status',{cache:'no-store'}).then(r=>r.json());
    if(status.user){location.replace('/');return}
    if(status.sub2Enabled===false)throw Error('Sub2 服务暂时不可用');
    const response=await fetch('/api/auth/captcha',{cache:'no-store'});
    if(!response.ok)throw Error('暂时无法读取 Sub2 登录验证配置');
    const options=await response.json();
    if(options.enabled!==true)return;
    captchaRequired=true;
    if(!options.siteKey||!/^[a-zA-Z0-9_-]{10,80}$/.test(options.siteKey))throw Error('Sub2 人机验证未正确配置');
    captcha.hidden=false;
    const script=document.createElement('script');
    script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    script.async=true;
    script.onload=()=>{
      if(!window.turnstile){message.textContent='人机验证组件加载失败';return}
      widgetId=window.turnstile.render(captcha,{
        sitekey:options.siteKey,theme:'dark',appearance:'always',
        callback:token=>{captchaToken=token;message.textContent=''},
        'expired-callback':()=>{captchaToken=''},
        'error-callback':()=>{captchaToken='';message.textContent='验证码暂不可用，请检查网络或当前域名的 Turnstile 授权';}
      });
    };
    script.onerror=()=>{message.textContent='人机验证服务加载失败，请检查网络后刷新页面'};
    document.head.appendChild(script);
  }catch(error){message.textContent=error.message||'无法加载登录配置';submit.disabled=true}
}
form.addEventListener('submit',async event=>{
  event.preventDefault();message.textContent='';
  if(captchaRequired&&!captchaToken){message.textContent='请先完成 Sub2 人机验证';return}
  submit.disabled=true;submit.textContent='正在验证 Sub2 账号…';
  try{
    const response=await fetch('/api/auth/sub2-login',{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Request':'1'},credentials:'same-origin',body:JSON.stringify({email:email.value.trim(),password:password.value,...(captchaToken?{turnstile_token:captchaToken}:{})})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw Error(data.error||'登录失败，请检查 Sub2 账号和密码');
    wasLoggedIn=true;password.value='';
    location.replace('/');
  }catch(error){message.textContent=error.message||'登录失败'}
  finally{
    if(captchaRequired&&!wasLoggedIn){captchaToken='';if(window.turnstile&&widgetId!==null)window.turnstile.reset(widgetId)}
    submit.disabled=false;submit.textContent='登录并进入画布';
  }
});
initializeLogin();
</script>
</body></html>
