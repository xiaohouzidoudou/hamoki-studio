services:
  hamoki-studio:
    build: .
    image: hamoki-studio:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8030}:8028"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8028
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      APP_ALLOWED_HOST: ${APP_ALLOWED_HOST:?Set APP_ALLOWED_HOST}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      COOKIE_SECURE: "1"
      MAX_CONCURRENT: ${MAX_CONCURRENT:-1}
      DATA_DIR: /app/data
    volumes:
      - hamoki_data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
volumes:
  hamoki_data:
