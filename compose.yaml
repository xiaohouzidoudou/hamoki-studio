services:
  hamoki-studio:
    build:
      context: .
      args:
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
    image: hamoki-studio:0.6.33-desktop-polish
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8030}:8028"
    environment:
      NODE_ENV: production
      COWART_PREVIEW: ${COWART_PREVIEW:-0}
      HOST: 0.0.0.0
      PORT: 8028
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_ALLOWED_HOST: ${APP_ALLOWED_HOST:-}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-1}
      DATA_DIR: /app/data
      INVITE_CODE: ${INVITE_CODE:-}
      USER_QUOTA_GB: ${USER_QUOTA_GB:-1}
      TOTAL_QUOTA_GB: ${TOTAL_QUOTA_GB:-5}
    volumes:
      - hamoki_data:/app/data
    mem_limit: 384m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
volumes:
  hamoki_data:
