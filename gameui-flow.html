<div class="flow-shell">
 <aside class="library">
   <div class="library-heading"><strong>项目资源</strong><button class="icon-btn" id="new-project" title="新建项目" aria-label="新建项目"><svg><use href="#i-plus"></use></svg></button></div>
   <label class="search-box"><svg><use href="#i-search"></use></svg><input id="flow-search" type="search" placeholder="搜索节点、图片、素材…" autocomplete="off" aria-label="搜索节点"></label>
   <div class="section-label"><span>项目</span><span id="project-count"></span></div>
   <nav id="flow-project-list" class="project-list" aria-label="项目列表"></nav>
   <div class="section-heading"><span>当前画布</span><button class="mini-link" id="add-note" title="添加便签"><svg><use href="#i-plus"></use></svg> 便签</button></div>
   <nav id="flow-layer-list" class="layer-list" aria-label="画布节点"></nav>
   <div class="section-heading recent"><span>最近生成</span><button class="mini-link" id="flow-show-history">查看全部 <svg><use href="#i-chevron"></use></svg></button></div>
   <div id="flow-recents" class="recents"></div>
   <div class="library-bottom">
     <input id="flow-upload" type="file" hidden accept="image/png,image/jpeg,image/webp" multiple>
     <button id="flow-upload-btn" class="upload-btn"><svg><use href="#i-upload"></use></svg> 上传参考图</button>
     <small>素材与衍生关系自动保存到当前项目</small>
   </div>
 </aside>

 <main class="workspace">
   <header class="workspace-header">
     <div class="breadcrumbs">
       <div class="crumb-name"><svg><use href="#i-node"></use></svg><strong>自由画布</strong><span>/</span><span id="flow-project-title">正在加载</span></div>
       <span class="crumb-status"><span class="status-dot"></span> 自由拖拽 · 版本衍生 · UI 拆件</span>
     </div>
     <div class="toolbar-actions">
       <button id="flow-backup" class="soft-button" title="下载可恢复的项目备份"><svg><use href="#i-save"></use></svg><span>保存版本</span></button>
       <button id="flow-export" class="primary-button" title="下载选中素材"><svg><use href="#i-download"></use></svg><span>导出素材</span></button>
       <button id="flow-settings" class="soft-button icon-only" title="中转站与模型设置" aria-label="打开设置"><svg><use href="#i-settings"></use></svg></button>
     </div>
   </header>
   <div class="canvas-toolbar">
     <span class="mode-title">节点画布</span>
     <div class="tools-group" role="group" aria-label="画布工具">
       <button class="tool active" data-tool="select" title="选择并拖动节点"><svg><use href="#i-cursor"></use></svg> 选择</button>
       <button class="tool" data-tool="pan" title="拖动画布"><svg><use href="#i-hand"></use></svg> 漫游</button>
     </div>
     <div class="canvas-toolbar-zoom">
       <button id="zoom-out" title="缩小" aria-label="缩小"><svg><path d="M5 12h14"/></svg></button><span id="zoom-readout">100%</span>
       <button id="zoom-in" title="放大" aria-label="放大"><svg><use href="#i-plus"></use></svg></button>
       <button id="zoom-fit" title="适应内容" aria-label="适应内容"><svg><use href="#i-fit"></use></svg></button>
     </div>
   </div>
   <section class="flow-viewport" id="flow-viewport" tabindex="0" aria-label="节点画布：滚轮缩放，中键或漫游工具拖动画布">
     <div class="canvas-help"><span class="status-dot"></span> 滚轮缩放 · 中键移动 · 选中图片 Ctrl+C 复制 / Ctrl+V 粘贴</div>
     <div class="flow-world" id="flow-world">
       <svg class="edge-layer" id="flow-edges" width="6000" height="4000" viewBox="0 0 6000 4000" aria-hidden="true"></svg>
       <div id="flow-nodes" class="node-layer"></div>
     </div>
     <div id="flow-empty" class="empty-hero" hidden>
       <div class="empty-icon"><svg><use href="#i-magic"></use></svg></div>
       <span class="eyebrow">HAMOKI CREATIVE WORKFLOW</span>
       <h2>从第一张游戏 UI 开始创作</h2>
       <p>上传参考图片，或添加便签整理想法。生成的版本会沿着连线持续延伸，所有操作保留在项目中。</p>
       <button class="primary-button" id="empty-upload"><svg><use href="#i-upload"></use></svg> 添加第一张图片</button>
     </div>
     <div class="canvas-rail"><button id="rail-add" title="添加参考图片" aria-label="添加参考图片"><svg><use href="#i-image"></use></svg></button><button id="rail-note" title="添加便签" aria-label="添加便签"><svg><use href="#i-pencil"></use></svg></button><button id="rail-fit" title="适应内容" aria-label="适应内容"><svg><use href="#i-fit"></use></svg></button></div>
     <div class="floating-tip" id="flow-floating-tip" hidden></div>
   </section>
   <footer class="flow-queue">
     <div class="queue-compact" id="flow-queue-summary"><span class="queue-dot"></span><strong>生成队列</strong><span id="flow-queue-text">正在检查任务…</span></div>
     <button id="flow-queue-toggle" class="mini-link" aria-expanded="false">查看队列 <svg><use href="#i-chevron"></use></svg></button>
     <div id="flow-queue-popover" class="queue-popover" hidden></div>
   </footer>
 </main>

 <aside class="inspector" id="flow-inspector">
   <button id="flow-inspector-toggle" class="inspector-mobile-toggle" type="button" aria-expanded="false" aria-controls="flow-inspector-content" aria-label="展开属性面板">属性</button>
   <div class="inspector-tabs" role="tablist">
     <button class="inspector-tab active" data-tab="properties" role="tab" aria-selected="true">属性</button>
     <button class="inspector-tab" data-tab="variants" role="tab" aria-selected="false">变体</button>
     <button class="inspector-tab" data-tab="history" role="tab" aria-selected="false">历史</button>
   </div>
   <div id="flow-inspector-content" class="inspector-content"></div>
   <div class="inspector-footer"><svg><use href="#i-check"></use></svg><span id="flow-save-state">所有更改自动保存</span></div>
 </aside>
</div>
<div id="flow-toast" class="flow-toast" role="status" aria-live="polite" hidden></div>
<div id="flow-dialog" class="dialog-backdrop" hidden>
  <section class="flow-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <header><div><span class="eyebrow" id="dialog-eyebrow">CREATIVE STUDIO</span><h2 id="dialog-title">新建操作</h2></div><button id="dialog-close" class="icon-btn" aria-label="关闭弹窗"><svg><use href="#i-close"></use></svg></button></header>
    <div id="dialog-body" class="dialog-body"></div>
    <footer id="dialog-footer"></footer>
  </section>
</div>

<script src="gameui-flow-tools.js?v=1"></script>
<script src="gameui-layered.js?v=1"></script>
<script src="assets/global-border-trace.js?v=1"></script>
